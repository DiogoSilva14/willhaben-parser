[package]
name = "willhaben-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15.13"
debug_print = "1.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0.140"
tokio = { version = "1.40.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.23.1"
